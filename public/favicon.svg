<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <!-- Background rounded badge identical to the dashboard & sidebar leaf logo -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#leafGrad)" />
  <rect x="2" y="2" width="44" height="22" rx="12" fill="#ffffff" fill-opacity="0.1" />

  <!-- Lucide Sprout / Leaf icon in white -->
  <g transform="translate(10, 10) scale(1.166)" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Ground line -->
    <path d="M7 20h10" />
    <!-- Main stem -->
    <path d="M10 20c5.5-2.5.8-6.4 3-10" />
    <!-- Left Leaf -->
    <path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z" fill="#ffffff" fill-opacity="0.22" />
    <!-- Right Leaf -->
    <path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z" fill="#ffffff" fill-opacity="0.22" />
